<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102a43">
  <title>Door Index | เปิดประตู</title>
  <link rel="stylesheet" href="door-index.css">
</head>
<body>
  <main class="door-shell">
    <section class="door-panel" aria-labelledby="page-title">
      <div class="brand-mark" aria-hidden="true">DI</div>
      <p class="eyebrow">Secure room access</p>
      <h1 id="page-title">เปิดประตูห้องพัก</h1>
      <p class="intro">เลือกห้องและยืนยันรหัสเข้าห้อง 6 หลัก</p>

      <form id="doorForm" novalidate>
        <label for="room">หมายเลขห้อง</label>
        <select id="room" name="room" required>
          <option value="" selected disabled>เลือกห้อง</option>
          <option value="101">ห้อง 101</option>
          <option value="102">ห้อง 102</option>
          <option value="103">ห้อง 103</option>
          <option value="104">ห้อง 104</option>
          <option value="105">ห้อง 105</option>
          <option value="106">ห้อง 106</option>
        </select>

        <label for="code">รหัสเข้าห้อง</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" placeholder="กรอกรหัส 6 หลัก" required>

        <button id="submitButton" type="submit">ยืนยันเพื่อเปิดประตู</button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite" hidden></div>
      <p class="connection-note">เชื่อมต่อกับระบบโรงแรมผ่าน API</p>
    </section>
  </main>
  <script src="door-index.js"></script>
</body>
</html>
